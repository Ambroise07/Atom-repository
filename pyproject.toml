[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atoms"
version = "0.1.0"
authors = [
  { name="Gnabro Israel", email="ambroiseisrael5@email.com" },
]
description = "Un framework automatiseur de taches usuels."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: Argparse,  rich",
]

dependencies = [
    "rich"
]

[project.urls]
"Homepage" = "https://github.com"

"license" = "LICENSE.txt"

